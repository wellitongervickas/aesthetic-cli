    <text y="40"  style="animation-duration:2.2s; animation-delay:0.80s;">3</text>
    <text y="60"  style="animation-duration:2.2s; animation-delay:0.95s;">ｩ</text>
    <text y="80"  style="animation-duration:2.2s; animation-delay:1.10s;">*</text>
