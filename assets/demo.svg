<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    @keyframes drop {
      0% { opacity: 0; transform: translateY(-40px); }
      10% { opacity: 1; }
      90% { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(400px); }
    }
    @keyframes glow {
      0%, 100% { fill: #00ff41; filter: drop-shadow(0 0 6px #00ff41); }
      50% { fill: #80ffA0; filter: drop-shadow(0 0 12px #80ffA0); }
    }
    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .bg { fill: #0d1117; }
    .col text {
      font-family: 'Courier New', monospace;
      font-size: 16px;
      fill: #00ff41;
      opacity: 0;
      animation: drop linear infinite;
    }
    .col text:last-child {
      animation: drop linear infinite, glow 0.4s ease-in-out infinite;
      fill: #ffffff;
      filter: drop-shadow(0 0 8px #00ff41);
    }
    .header-text {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      fill: #58a6ff;
    }
    .prompt {
      font-family: 'Courier New', monospace;
      font-size: 14px;
    }
    .prompt-path { fill: #bd93f9; }
    .prompt-arrow { fill: #50fa7b; }
    .prompt-cmd { fill: #f8f8f2; }
    .cursor {
      fill: #f8f8f2;
      animation: cursor-blink 1s step-end infinite;
    }
    .border { fill: none; stroke: #30363d; stroke-width: 2; rx: 12; }
    .title-dot { r: 6; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
  </style>

  <rect class="bg" width="800" height="400" rx="12"/>
  <rect class="border" x="1" y="1" width="798" height="398"/>

  <!-- Window dots -->
  <circle class="title-dot dot-red" cx="24" cy="20"/>
  <circle class="title-dot dot-yellow" cx="44" cy="20"/>
  <circle class="title-dot dot-green" cx="64" cy="20"/>

  <text class="header-text" x="350" y="24" text-anchor="middle">aesthetic-cli</text>

  <!-- Terminal prompt -->
  <text y="56">
    <tspan class="prompt-path" x="20">~/aesthetic-cli</tspan>
    <tspan class="prompt-arrow"> > </tspan>
    <tspan class="prompt-cmd">npm start</tspan>
    <tspan class="cursor">_</tspan>
  </text>

  <!-- Rain columns -->
  <g class="col" transform="translate(30, 70)">
    <text y="0"   style="animation-duration:2.8s; animation-delay:0.0s;">ﾊ</text>
    <text y="20"  style="animation-duration:2.8s; animation-delay:0.15s;">ﾐ</text>
    <text y="40"  style="animation-duration:2.8s; animation-delay:0.30s;">9</text>
    <text y="60"  style="animation-duration:2.8s; animation-delay:0.45s;">ｳ</text>
    <text y="80"  style="animation-duration:2.8s; animation-delay:0.60s;">ﾆ</text>
    <text y="100" style="animation-duration:2.8s; animation-delay:0.75s;">$</text>
    <text y="120" style="animation-duration:2.8s; animation-delay:0.90s;">ﾎ</text>
  </g>

  <g class="col" transform="translate(80, 70)">
    <text y="0"   style="animation-duration:3.5s; animation-delay:1.2s;">ﾌ</text>
    <text y="20"  style="animation-duration:3.5s; animation-delay:1.35s;">ﾄ</text>
    <text y="40"  style="animation-duration:3.5s; animation-delay:1.50s;">Z</text>
    <text y="60"  style="animation-duration:3.5s; animation-delay:1.65s;">ﾁ</text>
    <text y="80"  style="animation-duration:3.5s; animation-delay:1.80s;">ﾓ</text>
    <text y="100" style="animation-duration:3.5s; animation-delay:1.95s;">7</text>
